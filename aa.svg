<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <defs>
    <!-- تعريف تدرج لوني للظلال الخلفية -->
    <linearGradient id="back_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eaeaea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- خلفية اللوحة -->
  <rect x="0" y="0" width="1000" height="1000" fill="#f8f9fa" />

  <!-- حافة زجاجية بسيطة -->
  <rect x="20" y="20" width="960" height="960" rx="10" ry="10" stroke="#cccccc" stroke-width="2" fill="none" />

  <!-- مجموعة الأزرار -->
  <g transform="translate(500, 500)">
    <!-- الدوائر الثلاث -->
    <circle cx="0" cy="-260" r="100" stroke="#4d5a69" stroke-width="12" fill="none" />
    <circle cx="0" cy="0" r="100" stroke="#4d5a69" stroke-width="12" fill="none" />
    <circle cx="0" cy="260" r="100" stroke="#4d5a69" stroke-width="12" fill="none" />

    <!-- أيقونة المروحة العليا (+) -->
    <g transform="translate(0, -260) scale(1.1)" stroke="#b0bac5" stroke-width="8" fill="none">
      <path d="M 0,-60 C -15,-60 -30,-45 -30,-30 L -10,0 L 10,0 L 30,-30 C 30,-45 15,-60 0,-60 Z" />
      <path d="M 0,60 C -15,60 -30,45 -30,30 L -10,0 L 10,0 L 30,30 C 30,45 15,60 0,60 Z" />
      <path d="M 60,0 C 60,-15 45,-30 30,-30 L 0,-10 L 0,10 L 30,30 C 45,30 60,15 60,0 Z" />
      <path d="M -60,0 C -60,-15 -45,-30 -30,-30 L 0,-10 L 0,10 L -30,30 C -45,30 -60,15 -60,0 Z" />
      <path d="M -15,0 L 15,0" stroke-linecap="round"/>
      <path d="M 0,-15 L 0,15" stroke-linecap="round"/>
    </g>

    <!-- أيقونة التشغيل (Power) -->
    <g transform="translate(0, 0) scale(1.1)" stroke="#b0bac5" stroke-width="8" fill="none">
      <path d="M 0,0 L 0,-45" stroke-linecap="round"/>
      <path d="M -25,-25 A 35,35 0 1,0 25,-25" stroke-linecap="round"/>
    </g>

    <!-- أيقونة المروحة السفلى (-) -->
    <g transform="translate(0, 260) scale(1.1)" stroke="#b0bac5" stroke-width="8" fill="none">
      <path d="M 0,-60 C -15,-60 -30,-45 -30,-30 L -10,0 L 10,0 L 30,-30 C 30,-45 15,-60 0,-60 Z" />
      <path d="M 0,60 C -15,60 -30,45 -30,30 L -10,0 L 10,0 L 30,30 C 30,45 15,60 0,60 Z" />
      <path d="M 60,0 C 60,-15 45,-30 30,-30 L 0,-10 L 0,10 L 30,30 C 45,30 60,15 60,0 Z" />
      <path d="M -60,0 C -60,-15 -45,-30 -30,-30 L 0,-10 L 0,10 L -30,30 C -45,30 -60,15 -60,0 Z" />
      <path d="M -15,0 L 15,0" stroke-linecap="round"/>
    </g>
  </g>
</svg>
